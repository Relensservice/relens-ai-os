<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061f3d">
<meta name="description" content="ReLens To-Do List — Simple, fast task management with local storage.">
<title>ReLens To-Do List</title>
<style>
:root{--navy:#061f3d;--navy2:#0b3565;--gold:#eab52b;--bg:#f4f6fa;--ink:#13243a;--muted:#6d7b8d;--line:#e3e8ef;--green:#18a66a;--red:#dc2626;--shadow:0 14px 38px rgba(4,28,55,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:600px;margin:auto;min-height:100vh;background:#fff}.header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:24px 20px;text-align:center}.header h1{margin:0;font-size:28px}.header .tag{opacity:.9;font-size:12px;letter-spacing:.08em;margin-top:6px}.main{padding:20px}.input-group{display:flex;gap:8px;margin-bottom:20px}.input-group input{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:15px inherit;outline:none}.input-group input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(234,181,43,.1)}.input-group button{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer;transition:all .2s}.input-group button:hover{background:#f5c547;transform:scale(1.02)}.input-group button:active{transform:scale(.98)}.filters{display:flex;gap:8px;margin-bottom:20px;overflow:auto}.filter-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer;transition:all .2s;font-size:13px}.filter-btn:hover{border-color:var(--gold)}.filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}.stat-card{flex:1;min-width:100px;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}.stat-card .number{font-size:20px;font-weight:800;color:var(--navy)}.stat-card .label{font-size:12px;color:var(--muted);margin-top:4px}.todo-list{list-style:none;margin:0;padding:0}.todo-item{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:14px;display:flex;gap:12px;align-items:flex-start;transition:all .2s}.todo-item:hover{box-shadow:var(--shadow)}.todo-item.completed{opacity:.6}.todo-item input[type="checkbox"]{flex:0 0 20px;width:20px;height:20px;margin-top:2px;cursor:pointer;accent-color:var(--green)}.todo-item input[type="checkbox"]:checked+.todo-content .todo-text{text-decoration:line-through;color:var(--muted)}.todo-content{flex:1;min-width:0}.todo-text{color:var(--ink);line-height:1.4;word-break:break-word}.todo-date{font-size:12px;color:var(--muted);margin-top:4px}.todo-actions{display:flex;gap:6px;flex:0 0 auto}.btn-icon{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--muted);transition:all .2s;font-size:12px}.btn-icon:hover{border-color:var(--navy);color:var(--navy);background:#f9fafb}.btn-icon.delete:hover{border-color:var(--red);color:var(--red)}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty svg{width:60px;height:60px;opacity:.3;margin-bottom:12px}.empty p{margin:0;line-height:1.5}.priority-high{border-left:4px solid var(--red)}.priority-medium{border-left:4px solid var(--gold)}.priority-low{border-left:4px solid var(--green)}.priority-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 6px;border-radius:4px;text-transform:uppercase}.priority-high .priority-badge{background:#fee2e2;color:var(--red)}.priority-medium .priority-badge{background:#fef3c7;color:#b45309}.priority-low .priority-badge{background:#dcfce7;color:var(--green)}.footer{padding:20px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}@media(max-width:560px){.header h1{font-size:22px}.main{padding:16px}.filters{gap:6px}.stat-card{min-width:70px;padding:10px;font-size:13px}.stat-card .number{font-size:18px}.todo-item{padding:12px;flex-direction:column}.todo-actions{width:100%;justify-content:flex-end}}
</style>
</head>
<body>
<div class="app">
<header class="header"><h1>📋 To-Do List</h1><div class="tag">Manage your tasks with ease</div></header>

<div class="main">
<div class="input-group"><input type="text" id="todoInput" placeholder="Add a new task..." aria-label="Task input"><select id="priority" aria-label="Task priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select><button id="addBtn">Add</button></div>

<div class="filters" id="filters"></div>

<div class="stats"><div class="stat-card"><div class="number" id="totalCount">0</div><div class="label">Total</div></div><div class="stat-card"><div class="number" id="activeCount">0</div><div class="label">Active</div></div><div class="stat-card"><div class="number" id="completedCount">0</div><div class="label">Completed</div></div></div>

<ul class="todo-list" id="todoList"></ul>

<div class="empty" id="emptyState"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 2C5.13 2 2 5.13 2 9v6c0 3.87 3.13 7 7 7h6c3.87 0 7-3.13 7-7V9c0-3.87-3.13-7-7-7H9zm0 2h6c2.76 0 5 2.24 5 5v6c0 2.76-2.24 5-5 5H9c-2.76 0-5-2.24-5-5V9c0-2.76 2.24-5 5-5zm3 4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg><p>No tasks yet.<br>Add one to get started!</p></div>
</div>

<footer class="footer">Local storage enabled • Your tasks are saved automatically</footer>
</div>

<script>
const STORAGE_KEY='relens_todos';const filters=['All','Active','Completed'];let todos=[];let filter='All';const todoInput=document.getElementById('todoInput');const prioritySelect=document.getElementById('priority');const addBtn=document.getElementById('addBtn');const todoList=document.getElementById('todoList');const emptyState=document.getElementById('emptyState');const filtersContainer=document.getElementById('filters');const totalCount=document.getElementById('totalCount');const activeCount=document.getElementById('activeCount');const completedCount=document.getElementById('completedCount');function saveTodos(){localStorage.setItem(STORAGE_KEY,JSON.stringify(todos))}function loadTodos(){const saved=localStorage.getItem(STORAGE_KEY);todos=saved?JSON.parse(saved):[]}function addTodo(){const text=todoInput.value.trim();if(!text)return;const todo={id:Date.now(),text:text,completed:false,priority:prioritySelect.value,date:new Date().toLocaleDateString()};todos.unshift(todo);todoInput.value='';prioritySelect.value='medium';saveTodos();render()}function toggleTodo(id){const todo=todos.find(t=>t.id===id);if(todo)todo.completed=!todo.completed;saveTodos();render()}function deleteTodo(id){todos=todos.filter(t=>t.id!==id);saveTodos();render()}function setFilter(f){filter=f;renderFilters();render()}function getFilteredTodos(){if(filter==='All')return todos;if(filter==='Active')return todos.filter(t=>!t.completed);if(filter==='Completed')return todos.filter(t=>t.completed);return todos}function renderFilters(){filtersContainer.innerHTML=filters.map(f=>`<button class="filter-btn ${f===filter?'active':''}" data-filter="${f}">${f}</button>`).join('');document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter))}function updateStats(){totalCount.textContent=todos.length;activeCount.textContent=todos.filter(t=>!t.completed).length;completedCount.textContent=todos.filter(t=>t.completed).length}function render(){const filtered=getFilteredTodos();emptyState.style.display=filtered.length===0?'block':'none';todoList.innerHTML=filtered.map(todo=>`<li class="todo-item priority-${todo.priority} ${todo.completed?'completed':''}"><input type="checkbox" ${todo.completed?'checked':''} onchange="toggleTodo(${todo.id})" aria-label="Toggle task"><div class="todo-content"><div class="todo-text">${escapeHtml(todo.text)}</div><div class="todo-date"><span class="priority-badge">${todo.priority}</span> • ${todo.date}</div></div><div class="todo-actions"><button class="btn-icon" onclick="deleteTodo(${todo.id})" aria-label="Delete task">✕</button></div></li>`).join('');updateStats()}function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}loadTodos();renderFilters();render();addBtn.onclick=addTodo;todoInput.onkeydown=(e)=>{if(e.key==='Enter')addTodo()};prioritySelect.style.padding='12px 10px';prioritySelect.style.border='1px solid var(--line)';prioritySelect.style.borderRadius='8px';prioritySelect.style.font='15px inherit';prioritySelect.style.cursor='pointer';prioritySelect.onchange=()=>render();
</script>
</body>
</html>
